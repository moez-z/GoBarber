name: gobarber
description: GoBarber - barbershop appointment booking (customer, employee, owner, platform admin).
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  # `any` lets pub pick the intl version pinned by the Flutter SDK (required by flutter_localizations).
  intl: any
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true # generates lib/l10n/app_localizations*.dart from the ARB files
